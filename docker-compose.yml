services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-overseas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-overseas_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-overseas_erp_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - overseas_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-overseas} -d ${POSTGRES_DB:-overseas_erp_dev}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://overseas:overseas_dev_password@postgres:5432/overseas_erp_dev?schema=public}
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://overseas:overseas_dev_password@postgres:5432/overseas_erp_dev?schema=public}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    volumes:
      - overseas_erp_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: builder
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://overseas:overseas_dev_password@postgres:5432/overseas_erp_dev?schema=public}
      NEXT_TELEMETRY_DISABLED: "1"
    command: ["npx", "prisma", "db", "seed"]
    restart: "no"

volumes:
  overseas_erp_pgdata:
  overseas_erp_storage:
